<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32">
  <!-- 頂部木蓋 (採用扁平化深灰，在小尺寸下比複雜木紋更清晰) -->
  <path d="M10 4h12l-1 4H11z" fill="#4A4A4A"/>
  <path d="M11 5h10l-0.5 2h-9z" fill="#5C5C5C"/>
  
  <!-- 瓶口金屬螺紋銜接處 -->
  <rect x="12" y="9" width="8" height="2" fill="#8E8E8E"/>
  
  <!-- 紮實的米白色罐身 (核心主體) -->
  <path d="M12 11h8c2 0 3 1.5 4 3.5V26c0 1.5-1 2.5-2.5 2.5h-11C9 28.5 8 27.5 8 26V14.5c1-2 2-3.5 4-3.5z" fill="#F4F1EA"/>
  
  <!-- 核心深色 {...} 程式符號 (高對比、易辨識) -->
  <!-- 左大括號 { -->
  <path d="M14 16.5c-0.6 0-1 0.4-1 1v1.5c0 0.5-0.4 0.8-0.8 1 0.4 0.2 0.8 0.5 0.8 1v1.5c0 0.6 0.4 1 1 1" fill="none" stroke="#2C2C2C" stroke-width="1.2" stroke-linecap="round"/>
  
  <!-- 中間的三個點 ... -->
  <circle cx="15.2" cy="20" r="0.6" fill="#2C2C2C"/>
  <circle cx="16" cy="20" r="0.6" fill="#2C2C2C"/>
  <circle cx="16.8" cy="20" r="0.6" fill="#2C2C2C"/>
  
  <!-- 右大括號 } -->
  <path d="M18 16.5c0.6 0 1 0.4 1 1v1.5c0 0.5 0.4 0.8 0.8 1-0.4 0.2-0.8 0.5-0.8 1v1.5c0 0.6-0.4 1-1 1" fill="none" stroke="#2C2C2C" stroke-width="1.2" stroke-linecap="round"/>
</svg>
